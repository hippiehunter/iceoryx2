[package]
name = "linux-e2e-tests"
description = "iceoryx2: [internal] Linux cross-process end-to-end integration tests for secured IPC"
categories = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = false
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lib]
name = "linux_e2e_tests"
path = "common/src/lib.rs"

[[bin]]
name = "iox2-e2e-server"
path = "bins/src/server.rs"

[[bin]]
name = "iox2-e2e-client"
path = "bins/src/client.rs"

# NOTE (differs from windows-e2e-tests): dependencies are UNCONDITIONAL, not gated
# under [target.'cfg(windows)'.dependencies]. The coordinator + scenario code are
# portable and the child binaries perform real cross-process secured IPC on Linux.
[dependencies]
clap = { workspace = true }
iceoryx2 = { workspace = true, features = ["std"] }
iceoryx2-cal = { workspace = true, features = ["std"] }
iceoryx2-bb-loggers = { workspace = true, features = ["std", "console"] }
libc = { workspace = true }
